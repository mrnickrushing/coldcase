name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Cache Rokit tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.rokit
          key: rokit-${{ runner.os }}-${{ hashFiles('rokit.toml') }}

      - name: Install Rokit
        shell: bash
        run: |
          if [[ ! -x "$HOME/.rokit/bin/rokit" ]]; then
            curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/v1.2.0/scripts/install.sh | bash
          fi
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"

      - name: Install pinned tools
        run: rokit install --no-trust-check

      - name: Format
        run: stylua --check src tests

      - name: Lint
        run: selene src tests

      - name: Build
        run: |
          rojo build default.project.json -o ColdCase.rbxlx
          rojo sourcemap default.project.json -o sourcemap.json

      - name: Type check
        run: luau-lsp analyze --definitions=types/globalTypes.d.luau --sourcemap=sourcemap.json --ignore="vendor/**" src

      - name: Unit tests
        run: lune run tests
