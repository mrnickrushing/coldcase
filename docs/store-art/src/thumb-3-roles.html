<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;background:#0b0d10;color:#e8e6e1;font-family:'IBM Plex Mono',monospace;
 background-image:radial-gradient(1400px 800px at 28% 18%,#1b2530 0%,#0b0d10 62%);position:relative}
.wash{position:absolute;inset:0;background:linear-gradient(200deg,transparent 48%,rgba(217,68,63,.30) 100%)}
.display{font-family:'Big Shoulders Display',sans-serif;font-weight:800;line-height:.9;letter-spacing:.01em}
.kicker{font-size:30px;letter-spacing:.24em;color:#f2a63b;text-transform:uppercase}
.brand{position:absolute;left:110px;bottom:90px;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:54px;letter-spacing:.08em}
.panel{background:rgba(11,13,16,.82);border:2px solid #262d36;border-radius:12px}
</style></head><body><div class="wash"></div>
<div style="position:absolute;left:110px;top:120px;right:110px">
 <div class="kicker">Eight players · ninety seconds</div>
 <div class="display" style="font-size:150px;margin-top:24px">WHO DO YOU TRUST?</div>
 <div style="display:flex;gap:40px;margin-top:70px"><div class="panel" style="flex:1;padding:56px 48px;border-top:8px solid #d8d5cf"><div style="font-size:24px;letter-spacing:.2em;color:#6f7883">YOU ARE</div><div class="display" style="font-size:120px;color:#d8d5cf;margin-top:18px">INNOCENT</div><div style="font-size:32px;color:#a9afb7;line-height:1.5;margin-top:28px">No weapon. Investigate, deduce, survive.</div></div><div class="panel" style="flex:1;padding:56px 48px;border-top:8px solid #f2a63b"><div style="font-size:24px;letter-spacing:.2em;color:#6f7883">YOU ARE</div><div class="display" style="font-size:120px;color:#f2a63b;margin-top:18px">SHERIFF</div><div style="font-size:32px;color:#a9afb7;line-height:1.5;margin-top:28px">The only honest gun here. Shoot an innocent and you die too.</div></div><div class="panel" style="flex:1;padding:56px 48px;border-top:8px solid #d9443f"><div style="font-size:24px;letter-spacing:.2em;color:#6f7883">YOU ARE</div><div class="display" style="font-size:120px;color:#d9443f;margin-top:18px">MURDERER</div><div style="font-size:32px;color:#a9afb7;line-height:1.5;margin-top:28px">Take your time. Kill in the dark, where evidence can't be read.</div></div></div>
</div>
<div class="brand" style="bottom:60px">COLD CASE</div></body></html>
